# Standard override for ARM64
MACHINEOVERRIDES =. "aarch64:"

require conf/machine/include/arm/armv8a/tune-cortexa72.inc

KERNEL_IMAGETYPE = "Image"
SERIAL_CONSOLES = "115200;ttyAMA0"
PREFERRED_PROVIDER_virtual/kernel = "aember-kernel"

# ARM64 specific settings
DEFAULTTUNE = "cortexa72"

# ---------------------------------------------------------------------------
# Pin GCC to 14.x
#
# GCC 15.2.0 has an internal compiler error (ICE) in bb-reorder.cc during
# the sched_fusion RTL pass when building the aarch64 cross-compiler:
#   in schedule_block, at haifa-sched.cc:6672
# ---------------------------------------------------------------------------
GCCVERSION                              = "14.%"
PREFERRED_VERSION_gcc                   = "14.%"
PREFERRED_VERSION_gcc-cross-aarch64     = "14.%"
PREFERRED_VERSION_libgcc                = "14.%"
PREFERRED_VERSION_gcc-runtime           = "14.%"