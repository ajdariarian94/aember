# x86_64 LXC container config — aember
# Include base config
lxc.include = /etc/lxc/lxc.conf

# x86_64 architecture
lxc.arch = x86_64

# Console via ttyS0
lxc.console.path = /dev/tty1
lxc.tty.max = 4

# Allow x86_64 specific devices
lxc.cgroup2.devices.allow = c 4:* rwm
lxc.cgroup2.devices.allow = c 5:* rwm