# aarch64 LXC container config — aember
# Include base config
lxc.include = /etc/lxc/lxc.conf

# aarch64 architecture
lxc.arch = aarch64

# Console via ttyAMA0 (QEMU virt / Raspberry Pi primary UART)
lxc.console.path = /dev/ttyAMA0
lxc.tty.max = 4

# Allow aarch64 specific devices
lxc.cgroup2.devices.allow = c 4:* rwm
lxc.cgroup2.devices.allow = c 5:* rwm