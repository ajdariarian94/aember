# Base LXC container config — aember

# Networking via veth pair on lxcbr0 bridge
lxc.net.0.type = veth
lxc.net.0.link = lxcbr0
lxc.net.0.flags = up

# cgroup v2 resource limits
lxc.cgroup2.memory.limit_in_bytes = 256M
lxc.cgroup2.cpu.shares = 1024

# Logging
lxc.log.level = WARN
lxc.log.file = /var/log/lxc/default.log