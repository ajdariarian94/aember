# ===============================
# Architecture
# ===============================
CONFIG_ARM=y
CONFIG_MMU=y
CONFIG_ARM_THUMB=y
CONFIG_ARM_THUMBEE=n
CONFIG_AEABI=y
CONFIG_OABI_COMPAT=n

# ===============================
# Early boot / console
# ===============================
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_SERIAL_CORE=y
CONFIG_SERIAL_CORE_CONSOLE=y
CONFIG_VT=n
CONFIG_HVC_DRIVER=y

# Device Tree (required for ARMv7)
CONFIG_OF=y
CONFIG_OF_FLATTREE=y
CONFIG_OF_EARLY_FLATTREE=y

# ===============================
# Init / PID1
# ===============================
CONFIG_BINFMT_ELF=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_INIT_ENV_ARG_LIMIT=32
CONFIG_DEFAULT_INIT="/init"

# ===============================
# Filesystems (minimal)
# ===============================
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=n
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_PSEUDO_FS=y

# ===============================
# Networking (basic, container-ready)
# ===============================
CONFIG_NET=y
CONFIG_INET=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_NETFILTER=y
CONFIG_BRIDGE=y
CONFIG_VETH=y
CONFIG_NET_NS=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y

# ===============================
# Storage (basic block + initramfs)
# ===============================
CONFIG_BLK_DEV=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_VIRTIO_BLK=y
CONFIG_EXT4_FS=y

# ARM-specific block devices
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y

# ===============================
# Device drivers (VM + bare metal friendly)
# ===============================
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_PCI_HOST_GENERIC=y

# VirtIO (QEMU/KVM support)
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y

# ARM-specific drivers
CONFIG_ARM_TIMER_SP804=y
CONFIG_COMMON_CLK=y
CONFIG_CLKDEV_LOOKUP=y

# Network drivers
CONFIG_SMSC911X=y

# ===============================
# ARM Platform Support
# ===============================
# QEMU virt machine
CONFIG_ARCH_VEXPRESS=y
CONFIG_ARCH_MULTI_V7=y

# Optional: Raspberry Pi
# CONFIG_ARCH_BCM=y
# CONFIG_ARCH_BCM2835=y

# ===============================
# Security / hardening (lightweight)
# ===============================
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y

# ARM-specific security
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_CPU_SW_DOMAIN_PAN=y

# ===============================
# Debugging (off for size)
# ===============================
CONFIG_DEBUG_KERNEL=n
CONFIG_DEBUG_FS=n
CONFIG_KALLSYMS=n
CONFIG_PRINTK=y