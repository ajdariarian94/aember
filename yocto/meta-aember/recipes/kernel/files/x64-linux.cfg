# ===============================
# Architecture
# ===============================
CONFIG_X86_64=y
CONFIG_64BIT=y
CONFIG_X86=y
CONFIG_MMU=y

# ===============================
# Early boot / console
# ===============================
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_NR_UARTS=4
CONFIG_SERIAL_8250_RUNTIME_UARTS=4
CONFIG_HVC_DRIVER=y

# ===============================
# Init / PID1
# ===============================
CONFIG_BINFMT_ELF=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_INIT_ENV_ARG_LIMIT=32
CONFIG_DEFAULT_INIT="/init"

# ===============================
# Filesystems (minimal)
# ===============================
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=n
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_PSEUDO_FS=y

# ===============================
# Networking (basic, container-ready)
# ===============================
CONFIG_NET=y
CONFIG_INET=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_NETFILTER=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_BRIDGE=y
CONFIG_VETH=y
CONFIG_NET_NS=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y

# ===============================
# Storage (basic block + initramfs)
# ===============================
CONFIG_BLK_DEV=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_VIRTIO_BLK=y
CONFIG_EXT4_FS=y

# ===============================
# Device drivers (VM + bare metal friendly)
# ===============================
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_NET=y
CONFIG_E1000=y
CONFIG_E1000E=y

# ===============================
# Security / hardening (lightweight)
# ===============================
CONFIG_RANDOMIZE_BASE=y
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y

# ===============================
# Debugging (off for size)
# ===============================
CONFIG_DEBUG_KERNEL=n
CONFIG_DEBUG_FS=n
CONFIG_KALLSYMS=n
CONFIG_PRINTK=y

# ===============================
# Framebuffer / Display (virtio-gpu for QEMU)
# ===============================
CONFIG_FB=y
CONFIG_FB_VESA=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_DRM=y
CONFIG_DRM_VIRTIO_GPU=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_TTM=y
CONFIG_VIRTIO_MMIO=y

# ===============================
# Input (needed for display)
# ===============================
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_DUMMY_CONSOLE=y
