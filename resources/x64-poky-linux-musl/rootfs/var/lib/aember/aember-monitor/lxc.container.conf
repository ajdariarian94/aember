# aember-monitor: generated by aember-build-helper (aember build)
lxc.uts.name = aember-monitor
lxc.rootfs.path = dir:/var/lib/aember/containers/aember-monitor
lxc.mount.auto = proc:mixed sys:mixed
lxc.autodev = 1
lxc.pty.max = 1
lxc.log.level = WARN
lxc.log.file = /tmp/lxc-aember-monitor.log
# The app's output (the container console), kept on the device
lxc.console.logfile = /var/log/aember-container-aember-monitor.log
lxc.console.size = 1MB
lxc.console.rotate = 1

# Network: none, only loopback
lxc.net.0.type = empty

lxc.environment = LC_ALL=C.UTF-8
lxc.environment = QT_PLUGIN_PATH=/usr/lib/plugins

# Devices (optional binds: the container starts without them)
lxc.mount.entry = /dev/fb0 dev/fb0 none bind,create=file,optional 0 0

# Extra lines from the manifest
# aember-stats' socket: /run/aember-stats on the host, read-only here (same hook as aember-stats: whichever starts first creates it)
lxc.hook.pre-start = /bin/sh -c "mkdir -p /run/aember-stats"
lxc.mount.entry = /run/aember-stats run/aember-stats none bind,ro,create=dir 0 0
