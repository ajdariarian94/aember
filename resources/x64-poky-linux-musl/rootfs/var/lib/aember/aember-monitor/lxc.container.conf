# /tmp/lxc-aember-monitor.conf
lxc.rootfs.path = dir:/var/lib/aember/containers/aember-monitor
lxc.uts.name = aember-monitor
lxc.mount.auto = proc:mixed sys:mixed
lxc.autodev = 1
lxc.pty.max = 1
lxc.log.level = TRACE
lxc.log.file = /tmp/lxc-aember-monitor.log

# Framebuffer access for Qt linuxfb platform
lxc.cgroup.devices.allow = c 29:0 rwm
lxc.mount.entry = /dev/fb0 dev/fb0 none bind,create=file,optional 0 0

# DRM/GPU access for Qt eglfs platform
lxc.cgroup.devices.allow = c 226:0 rwm
lxc.cgroup.devices.allow = c 226:128 rwm
lxc.mount.entry = /dev/dri dev/dri none bind,create=dir,optional 0 0

# Qt platform: the framebuffer on a device. aember's chroot launcher
# overrides it (QT_QPA_PLATFORM=xcb + DISPLAY) through
# /etc/aember/lxc-extra.conf to draw on the host's X server instead; the
# device binds above are optional so the container also starts without them.
lxc.environment = QT_QPA_PLATFORM=linuxfb
