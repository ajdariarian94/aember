# aember-stats: generated by aember-build-helper (aember build)
lxc.uts.name = aember-stats
lxc.rootfs.path = dir:/var/lib/aember/containers/aember-stats
lxc.mount.auto = proc:mixed sys:mixed
lxc.autodev = 1
lxc.pty.max = 1
lxc.log.level = WARN
lxc.log.file = /tmp/lxc-aember-stats.log
# The app's output (the container console), kept on the device
lxc.console.logfile = /var/log/aember-container-aember-stats.log
lxc.console.size = 1MB
lxc.console.rotate = 1

# Network: aember's own (the host network namespace)
lxc.net.0.type = none

# Extra lines from the manifest
# The socket the monitor reads: /run/aember-stats on the host (aember mounts /run as tmpfs), shared with aember-monitor
lxc.hook.pre-start = /bin/sh -c "mkdir -p /run/aember-stats"
lxc.mount.entry = /run/aember-stats run/aember-stats none bind,create=dir 0 0
