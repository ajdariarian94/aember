MACHINE ?= "qemux86-64"

DISTRO ?= "poky"

IMAGE_FSTYPES += "cpio.gz"

# Bundle initramfs inside kernel
INITRAMFS_IMAGE = "core-image-minimal-initramfs"
INITRAMFS_IMAGE_BUNDLE = "1"

# Extra packages (still keep busybox in case you want tools for debugging)
CORE_IMAGE_EXTRA_INSTALL += "busybox"

# Install our custom pieces
IMAGE_INSTALL:append = " init-script aember"
