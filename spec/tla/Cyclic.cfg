\* A cycle in the file: x, y and z never start, a and b do.
SPECIFICATION Spec
CONSTANTS
    Nodes <- Cyclic
    Deps <- CyclicDeps
    Restartable <- Cyclic
    MaxRestarts = 0
    MaxCrashes = 2
    ResetOnStable = FALSE
    CancelRestartsOnShutdown = TRUE
INVARIANTS
    TypeOK
    SkippedNeverStart
    SkipOnlyBad
    NoStartAfterShutdown
    FinishedMeansDown
PROPERTIES
    DepsBeforeStart
    DependentsStopFirst
    EveryGoodEntryRuns
    ShutdownCompletes
