\* Containers: max_restart_attempts 1 in a row, reset after kStableRun;
\* monitor has restart_policy "no".
SPECIFICATION Spec
CONSTANTS
    Nodes <- Diamond
    Deps <- DiamondDeps
    Restartable <- DiamondRestartable
    MaxRestarts = 1
    MaxCrashes = 2
    ResetOnStable = TRUE
    CancelRestartsOnShutdown = TRUE
INVARIANTS
    TypeOK
    SkippedNeverStart
    SkipOnlyBad
    NoStartAfterShutdown
    FinishedMeansDown
PROPERTIES
    DepsBeforeStart
    DependentsStopFirst
    EveryGoodEntryRuns
    ShutdownCompletes
