# Builds the dev container image (.devcontainer/Dockerfile) and publishes it
# to GHCR, so developers pull it instead of building it:
#   ghcr.io/ajdariarian94/aember-dev:latest
#   ghcr.io/ajdariarian94/aember-dev:<YYYYMMDD>-<short sha>   (immutable)
# On main: build and push when the Dockerfile or what it copies changes.
# On pull requests that touch them: build only, so a broken Dockerfile fails
# the PR before it reaches main.
name: Dev image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - requirements.txt
      - .github/workflows/dev-image.yml
  pull_request:
    paths:
      - .devcontainer/Dockerfile
      - requirements.txt
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ajdariarian94/aember-dev

jobs:
  image:
    name: Build (Ubuntu 24.04, aember SDK tools) and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Tags
        id: tags
        run: |
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "immutable=$tag" >> "$GITHUB_OUTPUT"
          echo "list=$IMAGE:latest,$IMAGE:$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Ubuntu 24.04, aember SDK tools dev container for ${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Published \`$IMAGE:latest\` and \`$IMAGE:${{ steps.tags.outputs.immutable }}\`" >> "$GITHUB_STEP_SUMMARY"
